<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coco Café · Menú</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=DM+Sans:wght@400;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#f28c0f; --naranja-osc:#d97706; --verde:#17803d; --cafe:#3b2412;
  --vino:#8f0a0a; --crema:#fff8ec; --papel:#fffdf8; --morado:#8e3fa8; --linea:#ecdcc3; --tenue:#8a6f55;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--crema);color:var(--cafe);font:16px/1.45 "DM Sans",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}

/* Encabezado */
header{position:relative;overflow:hidden;text-align:center;padding:36px 16px 28px;
  background:radial-gradient(circle at 85% -10%,#ffd08a 0 28%,transparent 29%),
             radial-gradient(circle at -5% 110%,#cfe9d6 0 24%,transparent 25%),var(--crema)}
.logo{display:block;width:168px;height:168px;margin:0 auto 14px;border-radius:50%;box-shadow:0 12px 28px #3b241238}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i .r{fill:currentColor;stroke:none}
h1{font:900 clamp(40px,11vw,64px)/.9 Fraunces,serif;margin:0;letter-spacing:-1px}
h1 span{display:block;font:700 .62em Caveat,cursive;color:var(--verde);transform:rotate(-4deg);margin-top:-4px}
.lema{margin:12px 0 0;color:var(--tenue);font-weight:500}

/* Navegación */
nav{position:sticky;top:0;z-index:5;background:#fff8ecee;backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.nav-in{max-width:1000px;margin:auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--papel);border:1.5px solid var(--linea);
  text-decoration:none;color:var(--cafe);font-weight:700;font-size:14px;white-space:nowrap}
.chip:hover{border-color:var(--naranja);color:var(--naranja-osc)}
#buscar{flex:none;width:150px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--linea);background:var(--papel)}

/* Secciones */
main{max-width:1000px;margin:auto;padding:20px 16px 110px;display:grid;gap:18px}
@media(min-width:860px){main{grid-template-columns:1fr 1fr;align-items:start}}
section{background:var(--papel);border:1.5px solid var(--linea);border-radius:22px;padding:18px 18px 12px;scroll-margin-top:72px}
.cab{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:4px solid var(--verde);margin-bottom:6px}
.cab .ico{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--naranja);color:#fff;font-size:26px}
h2{font:900 24px/1.05 Fraunces,serif;margin:0;color:var(--vino);text-transform:uppercase;flex:1}
.nota{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--verde);padding:4px 10px;border-radius:99px}
ul{list-style:none;margin:0;padding:0}
li,.tallas{display:grid;grid-template-columns:1fr 62px 62px;gap:6px;align-items:center}
li{padding:9px 0;border-bottom:1px dashed var(--linea)}
li:last-child{border:0}
.tallas{font-size:12px;font-weight:700;color:var(--tenue);text-transform:uppercase;text-align:center;padding-top:4px}
.precio{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;background:#fff1d8;border-radius:10px;padding:4px 0}
.precio.g{background:#e2f3e7;color:var(--verde)}
.precio:empty{background:none}
/* Fotos */
.banner{display:block;width:100%;height:230px;object-fit:contain;padding:14px 0 0;border-radius:14px;margin:6px 0 8px;
  filter:drop-shadow(0 6px 8px #3b241226);
  background:radial-gradient(circle 96px at 50% 56%,#ffcf85 98%,transparent),linear-gradient(#eaf6ec,#fff3dc)}
.nom{display:flex;align-items:center;gap:10px;min-width:0}
.foto{flex:none;padding:0;border:0;background:none;border-radius:12px}
.foto img{display:block;width:48px;height:48px;object-fit:cover;border-radius:12px}
.fbtn{position:relative;display:grid;place-items:center;width:44px;height:38px;padding:0;overflow:hidden;cursor:pointer;
  border:1.5px dashed var(--naranja);border-radius:10px;background:#fff7e8;color:var(--naranja-osc);font-size:20px}
.fbtn img{width:100%;height:100%;object-fit:cover}
.fbtn:focus-within{outline:3px solid var(--verde);outline-offset:2px}
.fcat{flex:1 1 100%;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tenue)}
dialog{border:0;border-radius:18px;padding:10px;max-width:min(92vw,520px);background:var(--papel);color:var(--cafe);text-align:center}
dialog::backdrop{background:#3b2412cc}
dialog img{display:block;max-width:100%;max-height:70vh;border-radius:12px;margin:auto}
dialog p{margin:10px 4px;font-weight:700}
.aviso{grid-column:1/-1;text-align:center}
.vacio{color:var(--tenue);font-size:14px;margin:8px 0}

/* Categoría sin productos = anuncio (Boba) */
section.anuncio{background:linear-gradient(135deg,var(--morado),#5b2a86);border:0;color:#fff;text-align:center;padding:28px 18px}
.anuncio .banner{margin:0 0 10px;padding:0;background:radial-gradient(circle 100px at 50% 54%,#ffffff33 98%,transparent)}
.anuncio .ico{font-size:56px;line-height:1}
.anuncio h2{font:700 56px/1 Caveat,cursive;color:#fff;text-transform:none}
.anuncio .nota{display:inline-block;margin-top:8px;background:#fff;color:var(--morado);font-size:14px}

/* Pie */
.pie{position:fixed;inset:auto 0 0;z-index:6;display:flex;gap:10px;justify-content:center;align-items:center;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--cafe);color:var(--crema);font-size:14px}
.pie .pronto{opacity:.85;display:flex;align-items:center;gap:6px}
.pie .pronto svg{font-size:18px;color:var(--naranja)}
.btn{flex:none;white-space:nowrap;border:0;border-radius:99px;padding:9px 16px;font-weight:700;background:var(--naranja);color:var(--cafe)}
.btn.sec{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.rojo{background:#b42318;color:#fff}

/* Modo edición */
.ed input,.ed select{width:100%;min-width:0;padding:8px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;font:inherit;color:inherit}
.ed .cab{flex-wrap:wrap}
.ed .cab .f-icon{width:104px}
.ed .cab .f-name{flex:1 1 140px;font-weight:700}
.ed .cab .f-note{flex:1 1 100%}
.ed li,.ed .tallas{grid-template-columns:44px 1fr 1fr 36px}
.ed li>input:first-child{grid-column:1/-1}
.ed input.sr{width:1px;padding:0;border:0}
.x{border:0;background:#fde7e4;color:#b42318;border-radius:10px;width:36px;height:36px;font-weight:700}
.mas{width:100%;margin:8px 0 6px;padding:10px;border:1.5px dashed var(--naranja);background:#fff7e8;border-radius:12px;font-weight:700;color:var(--naranja-osc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body>

<header>
  <img class="logo" src="logo.webp" alt="Coco Café" width="168" height="168">
  <h1>MENÚ <span>Coco Café</span></h1>
  <p class="lema">Calidad y sabor que nos distinguen</p>
</header>

<nav aria-label="Categorías"><div class="nav-in" id="nav"></div></nav>
<main id="menu"></main>
<div class="pie" id="pie"></div>
<dialog id="zoom" aria-labelledby="zoomCap">
  <img id="zoomImg" alt=""><p id="zoomCap"></p>
  <form method="dialog"><button class="btn">Cerrar</button></form>
</dialog>

<script>
// shortcut: el menú editado vive en localStorage (solo en este navegador);
// pasar a un backend/base de datos cuando se agreguen pedidos o varios dispositivos.
// shortcut: "Editar menú" no pide contraseña; solo está oculto y aparece con ?editar en el enlace.
// Agregar login real cuando la edición se guarde en un backend.
const ADMIN = new URLSearchParams(location.search).has('editar');
// shortcut: las fotos subidas se guardan reducidas dentro de localStorage (~5 MB en total);
// moverlas a almacenamiento de archivos cuando exista el backend.
const KEY = 'cocoMenu.v6';
const frappe = (n, a = 90, b = 100) => ({ name: n, p1: a, p2: b });
// Iconos propios (trazo 24x24); la categoría guarda solo la clave.
const ICONS = {
  frappe: ['Frappé', '<path d="M7 10h10l-1.1 11H8.1z"/><path d="M6 10a6 5 0 0 1 12 0z"/><path d="M12 5l2-3.5"/><path d="M7.6 15h8.8"/>'],
  taza:   ['Taza',   '<path d="M4 10h12v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H15.6"/><path d="M8 3c-1 1.3 1 1.9 0 3.5M12 3c-1 1.3 1 1.9 0 3.5"/><path d="M3 22h14"/>'],
  boba:   ['Boba',   '<path d="M6.5 8h11l-1.3 13H7.8z"/><path d="M5 8h14"/><path d="M13 8l2-6"/><circle class="r" cx="10" cy="17.5" r="1.2"/><circle class="r" cx="13.4" cy="18" r="1.2"/><circle class="r" cx="11.8" cy="14.6" r="1.2"/>'],
  postre: ['Postre', '<path d="M4 21h16v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M4 16c2 1.6 3 1.6 4 0s2-1.6 4 0 2 1.6 4 0 2-1.6 4 0"/><path d="M12 12V8"/><circle class="r" cx="12" cy="5.5" r="1.3"/>'],
  te:     ['Té',     '<path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14z"/><path d="M5 19l8.5-8.5"/>'],
  huella: ['Huella', '<ellipse class="r" cx="12" cy="16" rx="4.6" ry="3.8"/><circle class="r" cx="5.6" cy="11.6" r="1.9"/><circle class="r" cx="9.6" cy="7.4" r="2"/><circle class="r" cx="14.4" cy="7.4" r="2"/><circle class="r" cx="18.4" cy="11.6" r="1.9"/>'],
};
const ico = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${(ICONS[k] || ICONS.huella)[1]}</svg>`;

const DEFAULT = [
  { icon: 'frappe', name: 'Frappé / Café Helado', note: '', img: 'fotos/frappes.png', items: [
    ...['Vainilla', 'Caramelo', 'Chocolate Blanco', 'Mocha'].map(n => frappe(n, 80, 90)),
    ...['Oreo', 'Mamut', 'Nutella', 'Macha', 'Taro', 'Limonada Fresa', 'Limonada Limón',
        'Dragon Fruit', 'Frutos Rojos', 'Biscoff Lotus'].map(n => frappe(n)),
    { name: 'Americano', p1: 50, p2: '' } ] },
  { icon: 'taza', name: 'Capuccino', note: '', items:
    ['Vainilla', 'Caramelo', 'Chocolate Blanco', 'Mocha', 'Expresso', 'Chai', 'Chocolate Oaxaqueño']
      .map(n => frappe(n, 60, 70)) },
  { icon: 'taza', name: 'Café Artesanal', note: '', items:
    ['De la Casa', 'Vainilla', 'Chocolate'].map(n => frappe(n, 50, 60)) },
  { icon: 'te', name: 'Té', note: '', items: [
    ...['Fresas del Bosque', 'Fresa Vainilla', 'Frambuesa'].map(n => frappe(n, 50, 60)),
    // sin precio en el menú de Instagram
    ...['Chai Caramelo', 'Mango Fresa', 'Limón Granada'].map(n => frappe(n, '', '')) ] },
  { icon: 'boba', name: 'Boba', note: 'Viernes a domingo', img: 'fotos/boba.png', items: [] },
  { icon: 'postre', name: 'Postres', note: '', items: [
    { name: 'Suspiritos', p1: '', p2: '' }, { name: 'Tiramisú', p1: '', p2: '' } ] },
];

// Fotos ilustrativas generadas con IA (no son fotos reales del local), por categoría y posición.
[['frappe-vainilla', 'frappe-caramelo', 'frappe-chocolate-blanco', 'frappe-mocha', 'frappe-oreo', 'frappe-mamut',
  'frappe-nutella', 'frappe-macha', 'frappe-taro', 'limonada-fresa', 'limonada-limon', 'frappe-dragon-fruit',
  'frappe-frutos-rojos', 'frappe-biscoff', 'americano'],
 ['capuccino-vainilla', 'capuccino-caramelo', 'capuccino-chocolate-blanco', 'capuccino-mocha', 'expresso', 'chai', 'chocolate-oaxaqueno'],
 [], [], [], ['suspiritos', 'tiramisu']].forEach((fs, c) => fs.forEach((f, i) => DEFAULT[c].items[i].img = `fotos/${f}.jpg`));

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const money = p => (p === '' || p == null || isNaN(p)) ? '' : '$' + Number(p);
const plano = s => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
console.assert(money(80) === '$80' && money('') === '' && money('90.5') === '$90.5' && plano('Tiramisú') === 'tiramisu');

let menu, editing = false, q = '';
try { menu = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!Array.isArray(menu)) menu = structuredClone(DEFAULT);const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(menu)); }
  catch (e) { if (e.name === 'QuotaExceededError') alert('No hay espacio para guardar más fotos en este navegador. Quita alguna foto.'); }
};

// Reduce la foto a máx. 640 px y la devuelve como JPEG en data URL.
async function aFoto(file) {
  const bmp = await createImageBitmap(file), k = Math.min(1, 640 / Math.max(bmp.width, bmp.height));
  const cv = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);   // los PNG transparentes saldrían negros
  g.drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', .8);
}
const CAM = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>';
const fotoCtl = (o, ci, i) => {
  const d = `data-c="${ci}"${i === undefined ? '' : ` data-i="${i}"`}`;
  return o.img
    ? `<button class="fbtn" data-act="delFoto" ${d} aria-label="Quitar foto" title="Quitar foto"><img src="${esc(o.img)}" alt=""></button>`
    : `<label class="fbtn" title="Agregar foto">${CAM}<input class="sr" type="file" accept="image/*" ${d} aria-label="Agregar foto"></label>`;
};

function render() {
  document.body.classList.toggle('ed', editing);
  $('nav').innerHTML = editing ? '<b style="padding:8px 0">Modo edición · los cambios se guardan solos</b>'
    : menu.map((c, i) => `<a class="chip" href="#c${i}">${esc(c.name)}</a>`).join('')
      + `<label class="sr" for="buscar">Buscar</label><input id="buscar" type="search" placeholder="Buscar…" value="${esc(q)}">`;
  $('menu').innerHTML = editing ? menu.map(editCat).join('') + '<button class="mas" data-act="addCat">+ Agregar categoría</button>'
    : (menu.map(viewCat).join('') || '<p class="vacio">Sin resultados.</p>') + '<p class="vacio aviso">Fotos ilustrativas.</p>';
  $('pie').innerHTML = editing
    ? '<button class="btn rojo" data-act="reset">Restablecer</button><button class="btn" data-act="toggle">Listo</button>'
    : '<span class="pronto">' + ico('huella') + ' Pedidos en línea · pronto</span><button class="btn sec" data-act="toggle"' + (ADMIN ? '' : ' hidden') + '>Editar menú</button>';
}

function viewCat(c, i) {
  const items = c.items.filter(it => plano(it.name).includes(plano(q)));
  if (q && !items.length) return '';
  if (!c.items.length) return `<section class="anuncio" id="c${i}">${c.img ? `<img class="banner" src="${esc(c.img)}" alt="Foto de ${esc(c.name)}">` : `<div class="ico">${ico(c.icon)}</div>`}
    <h2>${esc(c.name)}</h2>${c.note ? `<span class="nota">${esc(c.note)}</span>` : ''}</section>`;
  const dos = c.items.some(it => money(it.p2));
  return `<section id="c${i}"><div class="cab"><span class="ico">${ico(c.icon)}</span><h2>${esc(c.name)}</h2>
    ${c.note ? `<span class="nota">${esc(c.note)}</span>` : ''}</div>
    ${c.img && !q ? `<img class="banner" src="${esc(c.img)}" alt="Foto de ${esc(c.name)}">` : ''}
    ${dos ? '<div class="tallas"><span></span><span>Chico</span><span>Grande</span></div>' : ''}
    <ul>${items.map(it => `<li><span class="nom">${it.img ? `<button class="foto" data-act="zoom" data-n="${esc(it.name)}" aria-label="Ver foto de ${esc(it.name)}"><img src="${esc(it.img)}" alt=""></button>` : ''}<span>${esc(it.name)}</span></span><span class="precio">${money(it.p1)}</span><span class="precio g">${money(it.p2)}</span></li>`).join('')}</ul></section>`;
}

function editCat(c, ci) {
  const f = (field, cls, ph, extra = '') =>
    `<input class="${cls}" data-c="${ci}" data-f="${field}" value="${esc(c[field])}" placeholder="${ph}" aria-label="${ph}" ${extra}>`;
  const sel = `<select class="f-icon" data-c="${ci}" data-f="icon" aria-label="Icono">${Object.entries(ICONS).map(([k, [n]]) =>
    `<option value="${k}"${k === c.icon ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
  return `<section><div class="cab">${sel}${f('name', 'f-name', 'Nombre de la categoría')}
    <button class="x" data-act="delCat" data-c="${ci}" aria-label="Eliminar categoría">✕</button>
    ${f('note', 'f-note', 'Nota (ej. Viernes a domingo)')}
    <div class="fcat">${fotoCtl(c, ci)}<span>Foto de la categoría</span></div></div>
    <div class="tallas"><span></span><span>Chico</span><span>Grande</span><span></span></div>
    <ul>${c.items.map((it, i) => `<li>
      <input data-c="${ci}" data-i="${i}" data-f="name" value="${esc(it.name)}" placeholder="Producto" aria-label="Producto">
      ${fotoCtl(it, ci, i)}
      <input data-c="${ci}" data-i="${i}" data-f="p1" value="${esc(it.p1)}" type="number" min="0" inputmode="decimal" placeholder="$" aria-label="Precio chico">
      <input data-c="${ci}" data-i="${i}" data-f="p2" value="${esc(it.p2)}" type="number" min="0" inputmode="decimal" placeholder="$" aria-label="Precio grande">
      <button class="x" data-act="delItem" data-c="${ci}" data-i="${i}" aria-label="Eliminar producto">✕</button></li>`).join('')}</ul>
    <button class="mas" data-act="addItem" data-c="${ci}">+ Agregar producto</button></section>`;
}

document.addEventListener('input', e => {
  const t = e.target, { c, i, f } = t.dataset;
  if (t.id === 'buscar') {            // re-render solo de la lista para no perder el foco
    q = t.value;
    $('menu').innerHTML = menu.map(viewCat).join('') || '<p class="vacio">Sin resultados.</p>';
  } else if (f) { (i === undefined ? menu[c] : menu[c].items[i])[f] = t.value; save(); }
});

document.addEventListener('change', async e => {
  const t = e.target, { c, i } = t.dataset;
  if (t.type !== 'file' || !t.files[0]) return;
  try { (i === undefined ? menu[c] : menu[c].items[i]).img = await aFoto(t.files[0]); }
  catch { return alert('No se pudo leer esa imagen.'); }
  save(); render();
});

document.addEventListener('click', e => {
  if (e.target.id === 'zoom') return e.target.close();   // clic en el fondo
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, c, i } = b.dataset;
  if (act === 'zoom') {
    $('zoomImg').src = b.querySelector('img').src; $('zoomCap').textContent = b.dataset.n;
    return $('zoom').showModal();
  }
  if (act === 'delFoto') delete (i === undefined ? menu[c] : menu[c].items[i]).img;
  else if (act === 'toggle') { editing = !editing; q = ''; scrollTo(0, 0); }
  else if (act === 'addItem') menu[c].items.push({ name: '', p1: '', p2: '' });
  else if (act === 'delItem') menu[c].items.splice(i, 1);
  else if (act === 'addCat') menu.push({ icon: 'huella', name: 'Nueva categoría', note: '', items: [] });
  else if (act === 'delCat') { if (!confirm(`¿Eliminar "${menu[c].name}" y todos sus productos?`)) return; menu.splice(c, 1); }
  else if (act === 'reset') { if (!confirm('¿Volver al menú original? Se perderán tus cambios.')) return; menu = structuredClone(DEFAULT); }
  save(); render();
  if (act === 'addItem') $('menu').querySelector(`[data-c="${c}"][data-i="${menu[c].items.length - 1}"]`)?.focus();
});

render();
</script>
</body>
</html>
